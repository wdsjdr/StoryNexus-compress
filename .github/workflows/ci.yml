name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: 压缩引擎测试（pytest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: 安装依赖
        run: pip install -e ".[bench,dev]"
      - name: 运行测试
        run: python -m pytest -q
